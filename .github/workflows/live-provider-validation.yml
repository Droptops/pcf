name: Live Provider Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/run/live-provider-validation.trigger

permissions:
  contents: read

concurrency:
  group: live-provider-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PCF_ANTHROPIC_API_KEY: ${{ secrets.PCF_ANTHROPIC_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install live dependencies
        run: python -m pip install -e '.[live]'

      - name: Require provider credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "OPENAI_API_KEY is not configured"
            exit 2
          fi
          if [[ -z "${PCF_ANTHROPIC_API_KEY:-}" && -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "PCF_ANTHROPIC_API_KEY or ANTHROPIC_API_KEY is not configured"
            exit 2
          fi
          echo "Provider credentials are configured"

      - name: OpenAI one-call smoke
        run: >-
          python scripts/live_memory_placement.py --run --provider openai
          --turns 1 --repeats 1 --arms front --history-style varied
          --workers 1 > /tmp/openai-smoke.json

      - name: Anthropic one-call smoke
        run: >-
          python scripts/live_memory_placement.py --run --provider anthropic
          --anthropic-route direct --thinking disabled
          --turns 1 --repeats 1 --arms front --history-style varied
          --workers 1 > /tmp/anthropic-smoke.json

      - name: OpenAI bounded 12-turn matrix
        run: >-
          python scripts/live_memory_placement.py --run --provider openai
          --turns 12 --repeats 1 --arms front tail placed --history-style varied
          --workers 1 > /tmp/openai-matrix.json

      - name: Anthropic bounded 12-turn matrix
        run: >-
          python scripts/live_memory_placement.py --run --provider anthropic
          --anthropic-route direct --thinking disabled
          --turns 12 --repeats 1 --arms front tail placed --history-style varied
          --workers 1 > /tmp/anthropic-matrix.json

      - name: Print sanitized benchmark summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = {
              "openai_smoke": Path("/tmp/openai-smoke.json"),
              "anthropic_smoke": Path("/tmp/anthropic-smoke.json"),
              "openai_matrix": Path("/tmp/openai-matrix.json"),
              "anthropic_matrix": Path("/tmp/anthropic-matrix.json"),
          }
          summary = {}
          for name, path in files.items():
              data = json.loads(path.read_text())
              meta = data.get("meta", {})
              summary[name] = {
                  "provider": meta.get("provider"),
                  "model": meta.get("model"),
                  "anthropic_route": meta.get("anthropic_route"),
                  "turns": meta.get("turns"),
                  "repeats": meta.get("repeats"),
                  "arms": meta.get("arms"),
                  "git_sha": meta.get("git_sha"),
                  "aggregate": data.get("aggregate"),
              }
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
