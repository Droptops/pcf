name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a description edit must not cancel the test run of the code it describes
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && 'description' || 'code' }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Public metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public files, new commit messages and the pull request description
        env:
          PCF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_public_metadata.py

  test:
    name: Python ${{ matrix.python-version }}
    if: github.event.action != 'edited'  # a description edit changes no code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Offline examples and provider smoke check
        run: |
          python examples/demo.py
          python scripts/live_smoke.py
      - name: Build and verify installed wheel
        if: matrix.python-version == '3.14'
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from pcf import Context, Segment
          from pcf.schemas import validate
          from pcf.families.sim import family_a
          from pcf.router import Candidate, Router, UncalibratedSource
          ctx = Context([Segment('s', 'system', 'stable'), Segment('u', 'user', 'hello')])
          engine = family_a()
          candidate = Candidate(engine.compiler, engine.cache, 1, .1, is_fallback=True)
          decision = Router([candidate], UncalibratedSource(lambda ctx, cand: .5)).route(ctx, 0)
          validate('pcf', ctx.to_json())
          validate('cache-descriptor', engine.descriptor.to_json())
          validate('route-decision', decision.to_json())
          print('Installed wheel and all packaged schemas verified')
          PY
