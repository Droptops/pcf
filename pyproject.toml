[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcf"
version = "0.2.0"
description = "Portable Context Format: a layered reference implementation for interoperable model context and cache control planes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manny Villegas", email = "m4villegas@gmail.com" }]
dependencies = ["rfc8785>=0.1.4,<0.2", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.16,<0.17"]
live = ["anthropic>=1.8,<2", "openai>=3.19,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"pcf.schemas" = ["*.json"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
