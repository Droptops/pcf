[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcf"
version = "0.3.0a1"
description = "Portable Context Format: provider-neutral LLM context compiled into cache-aware OpenAI and Anthropic requests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manny Villegas", email = "m4villegas@gmail.com" }]
dependencies = ["rfc8785>=0.1.4,<0.2", "jsonschema>=4.23,<5"]
keywords = ["llm", "prompt-caching", "context", "routing", "openai", "anthropic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/Droptops/pcf"
Repository = "https://github.com/Droptops/pcf"
Issues = "https://github.com/Droptops/pcf/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.16,<0.17"]
live = ["anthropic>=1.8,<2", "openai>=3.19,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"pcf.schemas" = ["*.json"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
